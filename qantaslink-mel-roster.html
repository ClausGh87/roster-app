<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QantasLink MEL A220 Roster</title>
<style>
  :root{
    --qf-red:#e40000;
    --bg:#f6f7f9;
    --panel:#ffffff;
    --line:#e2e5e9;
    --text:#1c2126;
    --muted:#6b7280;
    --gold:#b8860b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    background:#fff;
    border-bottom:3px solid var(--qf-red);
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
  }
  header h1{margin:0; font-size:1.15rem;}
  header h1 span{color:var(--qf-red);}
  header .sub{color:var(--muted); font-size:0.78rem;}
  .stats{display:flex; gap:14px;}
  .stat{text-align:center;}
  .stat .num{font-size:1.1rem; font-weight:700; color:var(--qf-red);}
  .stat .lbl{color:var(--muted); font-size:0.68rem;}
  nav{
    display:flex; gap:6px; padding:8px 20px; background:#fff;
    border-bottom:1px solid var(--line);
  }
  nav button{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:0.82rem;
  }
  nav button.active{background:var(--qf-red); color:#fff; border-color:var(--qf-red);}
  main{padding:18px 20px; max-width:1000px; margin:0 auto;}
  section{display:none;}
  section.active{display:block;}

  .duty-card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:16px; margin-bottom:14px;
  }
  .duty-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
  .duty-head h2{margin:0; font-size:1rem;}
  .reroll-btn{
    background:#fff; border:1px solid var(--qf-red); color:var(--qf-red);
    padding:6px 12px; border-radius:6px; cursor:pointer; font-size:0.78rem; font-weight:600;
  }
  .leg{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:0.85rem;
  }
  .leg:last-child{border-bottom:none;}
  .leg .route{font-weight:600;}
  .leg .flt{color:var(--gold); font-size:0.78rem; margin-left:8px;}
  .leg .time{color:var(--muted); font-size:0.8rem;}
  .leg a{color:var(--qf-red); text-decoration:none; font-size:0.78rem; font-weight:600; margin-left:10px;}
  .commit-btn{
    margin-top:10px; background:var(--qf-red); color:#fff; border:none;
    padding:8px 16px; border-radius:6px; cursor:pointer; font-size:0.82rem; font-weight:600;
  }

  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:0.8rem;}
  .card b{color:var(--qf-red);}
  .card .m{color:var(--muted); font-size:0.72rem;}

  svg{width:100%; height:auto; background:#fff; border-radius:10px; border:1px solid var(--line);}
  .route-line{stroke:var(--qf-red); stroke-width:1.4; stroke-dasharray:4 3; opacity:0.6;}
  .dest-dot{fill:var(--gold); stroke:#fff; stroke-width:1;}
  .hub-dot{fill:var(--qf-red); stroke:#fff; stroke-width:2;}
  .lbl-code{fill:var(--text); font-size:13px; font-weight:700;}
  .lbl-sub{fill:var(--muted); font-size:10px;}

  table{width:100%; border-collapse:collapse; margin-top:8px; font-size:0.8rem;}
  th,td{text-align:left; padding:7px 6px; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-size:0.68rem; text-transform:uppercase;}
  .empty{color:var(--muted); font-style:italic; padding:10px 0; font-size:0.85rem;}
  .del{background:none; border:none; color:var(--muted); cursor:pointer;}
  .del:hover{color:var(--qf-red);}
  footer{text-align:center; color:var(--muted); font-size:0.7rem; padding:16px; opacity:0.7;}
</style>
</head>
<body>

<div id="loginScreen" style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg);">
  <div style="background:#fff; border:1px solid var(--line); border-radius:12px; padding:32px; width:280px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.06);">
    <svg width="52" height="52" viewBox="0 0 52 52" style="margin-bottom:8px;">
      <circle cx="26" cy="26" r="25" fill="#fff" stroke="#e40000" stroke-width="2"/>
      <path d="M10 30 Q26 10 42 30 Q34 26 26 30 Q18 34 10 30 Z" fill="#e40000"/>
      <circle cx="26" cy="20" r="3.2" fill="#e40000"/>
    </svg>
    <div style="font-size:1.05rem; font-weight:700; margin-bottom:2px;">Qantas<span style="color:var(--qf-red);">Link</span> Crew Portal</div>
    <div style="color:var(--muted); font-size:0.72rem; margin-bottom:20px;">MEL / SYD / BNE Bases</div>
    <label style="display:block; text-align:left; font-size:0.72rem; color:var(--muted); margin-bottom:4px;">Crew ID</label>
    <input id="loginUser" type="text" value="ClausGh" style="width:100%; margin-bottom:12px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:0.85rem;">
    <label style="display:block; text-align:left; font-size:0.72rem; color:var(--muted); margin-bottom:4px;">Password</label>
    <input id="loginPass" type="password" value="qantaslink" style="width:100%; margin-bottom:18px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:0.85rem;">
    <button onclick="doLogin()" style="width:100%; background:var(--qf-red); color:#fff; border:none; padding:10px; border-radius:6px; font-weight:600; cursor:pointer; font-size:0.85rem;">Log In</button>
    <div style="color:var(--muted); font-size:0.65rem; margin-top:14px;">Local-only, no real authentication &middot; a new duty rolls on each login</div>
  </div>
</div>

<div id="appRoot" style="display:none;">

<header>
  <div style="display:flex; align-items:center; gap:10px;">
    <svg width="30" height="30" viewBox="0 0 52 52" style="flex-shrink:0;">
      <circle cx="26" cy="26" r="25" fill="#fff" stroke="#e40000" stroke-width="2"/>
      <path d="M10 30 Q26 10 42 30 Q34 26 26 30 Q18 34 10 30 Z" fill="#e40000"/>
      <circle cx="26" cy="20" r="3.2" fill="#e40000"/>
    </svg>
    <div>
      <h1>Qantas<span>Link</span> A220 Roster</h1>
      <div class="sub">Hubs MEL / SYD / BNE &middot; A220-300 (BCS3) &middot; VH-X4A &middot; SimBrief QLK</div>
    </div>
  </div>
  <div class="stats" id="headerStats"></div>
</header>

<nav>
  <button data-tab="duty" class="active">Duty Roster</button>
  <button data-tab="map">Map</button>
</nav>

<main>

  <section id="duty" class="active">
    <div class="duty-card">
      <div class="duty-head">
        <h2 id="dutyTitle">Today's Duty</h2>
        <button class="reroll-btn" onclick="rollDuty()">Reroll Duty</button>
      </div>
      <div id="dutyLegs"></div>
    </div>
    <div class="grid" id="airportCards"></div>
  </section>

  <section id="map">
    <div id="mapContainer"></div>
  </section>

</main>

<footer>Personal roster app &middot; SimBrief pilot ID 141979</footer>

</div>

<script>
const HUBS = [
  { icao:'YMML', iata:'MEL', city:'Melbourne, VIC', x:420, y:400, hub:true },
  { icao:'YSSY', iata:'SYD', city:'Sydney, NSW',     x:535, y:305, hub:true },
  { icao:'YBBN', iata:'BNE', city:'Brisbane, QLD',   x:560, y:230, hub:true },
];
const SPOKES = [
  { icao:'YPAD', iata:'ADL', city:'Adelaide, SA',    x:305, y:365, hub:false, block:{MEL:70,  SYD:110, BNE:140} },
  { icao:'YMLT', iata:'LST', city:'Launceston, TAS', x:470, y:470, hub:false, block:{MEL:65,  SYD:105, BNE:135} },
  { icao:'YMHB', iata:'HBA', city:'Hobart, TAS',     x:478, y:500, hub:false, block:{MEL:75,  SYD:110, BNE:140} },
  { icao:'YAYE', iata:'AYQ', city:'Yulara, NT',      x:170, y:180, hub:false, block:{MEL:160, SYD:180, BNE:170} },
  { icao:'YBHM', iata:'HTI', city:'Hamilton Island, QLD', x:606, y:168, hub:false, block:{MEL:140, SYD:120, BNE:90} },
  { icao:'YBCS', iata:'CNS', city:'Cairns, QLD',     x:556, y:111, hub:false, block:{MEL:170, SYD:150, BNE:120} },
];
const HUB_HUB = { 'MEL-SYD':80, 'SYD-MEL':80, 'MEL-BNE':120, 'BNE-MEL':120, 'SYD-BNE':85, 'BNE-SYD':85 };
const ALL_AIRPORTS = [...HUBS, ...SPOKES];
const AIRCRAFT_TYPE = 'BCS3';
const PILOT_ID = '141979';
const REGISTRATION = 'VH-X4A';
const AIRLINE_CODE = 'QLK';

function fmt(min){ const h=Math.floor(min/60), m=min%60; return `${h}:${String(m).padStart(2,'0')}`; }
function randOf(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function blockBetween(a,b){
  if(a.hub && b.hub) return HUB_HUB[`${a.iata}-${b.iata}`] || 90;
  if(a.hub) return b.block[a.iata] ?? 100;
  if(b.hub) return a.block[b.iata] ?? 100;
  // spoke-to-spoke: estimate via each spoke's distance from MEL as a common reference
  return Math.round((a.block.MEL + b.block.MEL) * 0.55);
}
function fltNum(used){
  let n;
  do { n = 1200 + Math.floor(Math.random()*799); } while(used.has(n));
  used.add(n);
  return 'QF'+n;
}
function simbriefLink(o,d,flt){
  return `https://www.simbrief.com/system/dispatch.php?airline=${AIRLINE_CODE}&fltnum=${flt.replace('QF','')}&type=${AIRCRAFT_TYPE}&orig=${o.icao}&dest=${d.icao}&reg=${REGISTRATION}&pid=${PILOT_ID}`;
}

let currentDuty = [];

function buildSequence(numLegs){
  const baseHub = randOf(HUBS);
  const pool = [...SPOKES];
  const pickSpoke = () => pool.splice(Math.floor(Math.random()*pool.length),1)[0];

  if(numLegs === 2) return [baseHub, pickSpoke(), baseHub];
  if(numLegs === 3) return [baseHub, pickSpoke(), randOf(HUBS), baseHub];
  // numLegs === 4: base - spoke - hub - spoke - base
  return [baseHub, pickSpoke(), randOf(HUBS), pickSpoke(), baseHub];
}

function rollDuty(){
  const legCount = 2 + Math.floor(Math.random()*3); // 2-4
  const sequence = buildSequence(legCount);
  const usedFlightNums = new Set();
  currentDuty = [];
  for(let i=0;i<sequence.length-1;i++){
    const o = sequence[i], d = sequence[i+1];
    currentDuty.push({ o, d, block: blockBetween(o,d), flt: fltNum(usedFlightNums) });
  }
  renderDuty();
}

function renderDuty(){
  document.getElementById('dutyTitle').textContent = `Duty \u2014 ${currentDuty.length} legs`;
  document.getElementById('dutyLegs').innerHTML = currentDuty.map(l => `
    <div class="leg">
      <div>
        <span class="route">${l.o.iata}\u2192${l.d.iata}</span>
        <span class="flt">${l.flt}</span>
      </div>
      <div>
        <span class="time">${fmt(l.block)}</span>
        <a href="${simbriefLink(l.o,l.d,l.flt)}" target="_blank">SimBrief</a>
      </div>
    </div>
  `).join('');
}

function renderCards(){
  document.getElementById('airportCards').innerHTML = ALL_AIRPORTS.map(a => `
    <div class="card"><b>${a.iata}</b>${a.hub ? ' <span style="color:var(--gold); font-size:0.68rem;">HUB</span>' : ''}<br>${a.city}<div class="m">${a.icao}${a.hub ? '' : ` &middot; ${fmt(a.block.MEL)} from MEL`}</div></div>
  `).join('');
}

function renderMap(){
  const hubLines = [
    `<line class="route-line" x1="${HUBS[0].x}" y1="${HUBS[0].y}" x2="${HUBS[1].x}" y2="${HUBS[1].y}" stroke="var(--gold)" stroke-width="1.6"/>`,
    `<line class="route-line" x1="${HUBS[0].x}" y1="${HUBS[0].y}" x2="${HUBS[2].x}" y2="${HUBS[2].y}" stroke="var(--gold)" stroke-width="1.6"/>`,
    `<line class="route-line" x1="${HUBS[1].x}" y1="${HUBS[1].y}" x2="${HUBS[2].x}" y2="${HUBS[2].y}" stroke="var(--gold)" stroke-width="1.6"/>`,
  ].join('');
  const spokeLines = SPOKES.map(s => HUBS.map(h => `<line class="route-line" x1="${h.x}" y1="${h.y}" x2="${s.x}" y2="${s.y}"/>`).join('')).join('');
  const hubDots = HUBS.map(h => `
    <circle class="hub-dot" cx="${h.x}" cy="${h.y}" r="9"/>
    <text class="lbl-code" x="${h.x-14}" y="${h.y+26}">${h.iata}</text>
  `).join('');
  const spokeDots = SPOKES.map(s => `
    <circle class="dest-dot" cx="${s.x}" cy="${s.y}" r="6"/>
    <text class="lbl-code" x="${s.x+10}" y="${s.y-4}">${s.iata}</text>
  `).join('');
  document.getElementById('mapContainer').innerHTML = `
    <svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
      ${spokeLines}${hubLines}${spokeDots}${hubDots}
    </svg>`;
}

function renderStats(){
  document.getElementById('headerStats').innerHTML = `
    <div class="stat"><div class="num">${SPOKES.length}</div><div class="lbl">Destinations</div></div>
    <div class="stat"><div class="num">${HUBS.length}</div><div class="lbl">Hubs</div></div>
  `;
}

document.querySelectorAll('nav button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

function doLogin(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  rollDuty(); // fresh duty generated on every login
}

// allow Enter key to submit from either field
['loginUser','loginPass'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if(e.key === 'Enter') doLogin();
  });
});

renderCards();
renderMap();
renderStats();
</script>

</body>
</html>
